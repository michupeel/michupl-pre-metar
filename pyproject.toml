[project]
name = "michupl-pre-metar"
version = "0.1.0"
description = "Raw-first prospective measurement of pre-METAR temperature information"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
    "polars>=1.20,<2",
    "truststore>=0.10,<1",
    "defusedxml>=0.7,<1",
    "astral>=3.2,<4",
]

[project.scripts]
premetar = "premetar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/premetar"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-defusedxml>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/premetar"]
